<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" role="img" aria-label="Credit dock">
  <defs>
    <linearGradient id="ofmcdIconArc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C8DFF"/>
      <stop offset="1" stop-color="#3ECFA0"/>
    </linearGradient>
  </defs>
  <!--
    A credit balance read as a gauge: a muted full ring, the remaining share in
    the accent arc, and one solid marker where the arc ends. Deliberately only
    three parts — a needle and tick marks read as mush at row size, and the two
    theme-neutral tones below stay visible on both light and dark surfaces.
  -->
  <circle cx="18" cy="18" r="11" fill="none" stroke="#7A838F" stroke-opacity="0.5" stroke-width="3.6"/>
  <path d="M18 7a11 11 0 0 1 10.6 13.9" fill="none" stroke="url(#ofmcdIconArc)"
        stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="27.4" cy="23.1" r="3.1" fill="#2F6BFF"/>
</svg>
